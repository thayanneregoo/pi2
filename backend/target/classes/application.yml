spring:
  application:
    name: deliveryfacil-api
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=DeliveryFacil;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:YourStrong!Passw0rd}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080
